name: Gofile Keep-Alive Pinger

on:
  schedule:
    # Runs automatically every 4 days at 00:00 UTC
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Enables manual trigger button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Keep-Alive Script
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: python ping.py
